name: release
# Candidate code (the built binaries) runs only in jobs with contents: read. publish (S3
# secrets, contents: write) runs no candidate binary and no repository script: it only copies
# files and runs gh and the tools.klar.ws publish action.
#
# Blocked before publishing (ci or gate failed): never retry the same version, and never
# start a fresh run for its tag (a rebuild gives different bytes, which both hosts refuse). Delete
# the tag (`git push origin :refs/tags/vX.Y.Z`), then either commit the fix and cut the next patch
# release, or commit VERSION back to the last published version (`dev` if nothing was published).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  # Shearbolt's release that gates candidates, pinned by version and by the SHA-256 of its
  # shearbolt-x86_64-unknown-linux-gnu.tar.gz.
  GATE_VERSION: '1.3.0'
  GATE_SHA256: '8b3e69d7b325cdacfd0882a1b4d2fa808617f447e94aaa16e68df45cbd4a7108'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        if: github.event_name == 'push'
        run: |
          git rev-parse --verify -q refs/remotes/origin/main >/dev/null || { echo "::error::the checkout has no origin/main"; exit 1; }
          rc=0; git merge-base --is-ancestor "$GITHUB_SHA^{commit}" refs/remotes/origin/main || rc=$?
          case $rc in
            0) ;;
            1) echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Release tags must point at a commit on main."; exit 1 ;;
            *) echo "::error::could not check whether $GITHUB_REF_NAME is on main"; exit 1 ;;
          esac
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="$(tr -d '[:space:]' < VERSION)"
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::VERSION says $version but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          else
            version="0.0.0-dryrun.$GITHUB_RUN_NUMBER"
          fi
          if ! printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?'; then
            echo "::error::$version is not a version of the form X.Y.Z or X.Y.Z-pre (letters, digits, '.', '-')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for t in amd64/x86_64-unknown-linux-gnu arm64/aarch64-unknown-linux-gnu; do
            goarch=${t%%/*}; triple=${t#*/}
            mkdir -p "build/$triple"
            CGO_ENABLED=0 GOOS=linux GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X github.com/klar-web-services/tripcoil/internal/buildinfo.Version=$VERSION" \
              -o "build/$triple/tripcoil" ./cmd/tripcoil
            tar -czf "dist/tripcoil-$triple.tar.gz" -C "build/$triple" tripcoil
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt && cat checksums.txt)
          test "$(build/x86_64-unknown-linux-gnu/tripcoil version | head -n1)" = "tripcoil $VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate
          path: dist/
          if-no-files-found: error

  gate:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: candidate
          path: ${{ runner.temp }}/dist
      - name: Unpack the candidates
        run: |
          (cd "$RUNNER_TEMP/dist" && sha256sum -c checksums.txt)
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            mkdir -p "$RUNNER_TEMP/candidate/$triple"
            tar -xzf "$RUNNER_TEMP/dist/tripcoil-$triple.tar.gz" -C "$RUNNER_TEMP/candidate/$triple" tripcoil
          done
      # The workflow pin, not the host, is the trust anchor for Shearbolt.
      - name: Gate with Shearbolt
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
          SHEARBOLT_CACHE_DIR: ${{ runner.temp }}/shearbolt-cache
        run: |
          a=shearbolt-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSL "https://tools.klar.ws/shearbolt/v$GATE_VERSION/$a" -o "$RUNNER_TEMP/$a"
          echo "$GATE_SHA256  $RUNNER_TEMP/$a" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gate"
          tar -xzf "$RUNNER_TEMP/$a" -C "$RUNNER_TEMP/gate" shearbolt
          "$RUNNER_TEMP/gate/shearbolt" scan --ci --config .github/release-gate.yaml --output-dir "$RUNNER_TEMP/gate-evidence"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gate-evidence
          path: ${{ runner.temp }}/gate-evidence
          if-no-files-found: warn

  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - name: The ci workflow passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while :; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')
            case $run in
              "completed success "*) echo "ci passed: ${run##* }"; exit 0 ;;
              completed*) echo "::error::ci did not pass on $GITHUB_SHA: $run"; exit 1 ;;
              "") echo "No ci run for $GITHUB_SHA yet." ;;
              *) echo "ci is running: $run" ;;
            esac
            sleep 30
          done

  publish:
    needs: [build, gate, ci]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check the publishing secrets
        env:
          TOOLS_S3_BUCKET: ${{ secrets.TOOLS_S3_BUCKET }}
          TOOLS_S3_ACCESS_KEY: ${{ secrets.TOOLS_S3_ACCESS_KEY }}
          TOOLS_S3_SECRET_KEY: ${{ secrets.TOOLS_S3_SECRET_KEY }}
        run: |
          missing=
          [ -n "$TOOLS_S3_BUCKET" ] || missing="${missing:+$missing, }TOOLS_S3_BUCKET"
          [ -n "$TOOLS_S3_ACCESS_KEY" ] || missing="${missing:+$missing, }TOOLS_S3_ACCESS_KEY"
          [ -n "$TOOLS_S3_SECRET_KEY" ] || missing="${missing:+$missing, }TOOLS_S3_SECRET_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets missing: $missing. Add them under Settings → Secrets and variables → Actions. Nothing was published. Re-run this job after adding them."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: candidate
          path: dist
      - name: Verify the candidate
        run: (cd dist && sha256sum -c checksums.txt)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          pre=()
          case "$VERSION" in *-*) pre=(--prerelease) ;; esac
          if info="$(gh release view "$tag" --json isDraft,assets --jq '.isDraft, .assets[].name' 2>/dev/null)"; then
            draft="$(printf '%s\n' "$info" | sed -n 1p)"
            have="$(printf '%s\n' "$info" | sed 1d | LC_ALL=C sort | tr '\n' ' ')"
            want="$(cd dist && printf '%s\n' * | LC_ALL=C sort | tr '\n' ' ')"
            if [ "$draft" != false ]; then
              echo "::error::The GitHub release $tag is a draft, probably left by a failed upload. Delete it (gh release delete $tag --yes; the tag stays), then re-run this job."
              exit 1
            fi
            if [ "$have" != "$want" ]; then
              echo "::error::The GitHub release $tag holds [ ${have}] instead of [ ${want}]. If a failed upload left it incomplete, delete it (gh release delete $tag --yes; the tag stays) and re-run this job; otherwise bump the version, because versions are immutable."
              exit 1
            fi
            sums="$PWD/dist/checksums.txt"
            mkdir -p "$RUNNER_TEMP/existing"
            gh release download "$tag" --dir "$RUNNER_TEMP/existing"
            if ! cmp -s "$RUNNER_TEMP/existing/checksums.txt" "$sums" || ! (cd "$RUNNER_TEMP/existing" && sha256sum -c "$sums"); then
              echo "::error::The GitHub release $tag already exists with different files. Versions are immutable: bump the version instead."
              exit 1
            fi
            echo "The GitHub release $tag already holds these files."
          else
            gh release create "$tag" dist/*.tar.gz dist/checksums.txt \
              --verify-tag --title "Tripcoil $tag" --generate-notes "${pre[@]}"
          fi
      - name: Stage the install script and landing page
        run: mkdir site && cp install.sh .github/tools-klar-ws/index.html site/
      - name: Publish to tools.klar.ws
        uses: klar-web-services/tools.klar.ws/publish@6d0c0851802c426f7307013acf9ed6cf992c64e4 # v1
        with:
          tool: tripcoil
          version: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          scripts: site
          bucket: ${{ secrets.TOOLS_S3_BUCKET }}
          access-key-id: ${{ secrets.TOOLS_S3_ACCESS_KEY }}
          secret-access-key: ${{ secrets.TOOLS_S3_SECRET_KEY }}

  verify:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Live install with curl, as root
        run: |
          curl -fsSL https://tools.klar.ws/tripcoil/install.sh | sudo TRIPCOIL_VERSION="$VERSION" sh
          test "$(/usr/local/bin/tripcoil version | head -n1)" = "tripcoil $VERSION"
      - name: install.sh is served as text/plain
        run: |
          curl -fsSI https://tools.klar.ws/tripcoil/install.sh | grep -i '^content-type: text/plain'
      - name: latest names this version
        if: "!contains(needs.build.outputs.version, '-')"
        run: |
          for _ in $(seq 1 12); do
            got="$(curl -fsS https://tools.klar.ws/tripcoil/latest | tr -d '[:space:]')" || got=
            [ "$got" != "$VERSION" ] || exit 0
            sleep 10
          done
          echo "::error::https://tools.klar.ws/tripcoil/latest says '$got', not $VERSION"
          exit 1
      - name: Install with BusyBox wget in Alpine
        run: |
          docker run --rm -e V="$VERSION" alpine:3.22 sh -c \
            'wget -qO- https://tools.klar.ws/tripcoil/install.sh | TRIPCOIL_VERSION="$V" sh && test "$(/usr/local/bin/tripcoil version | head -n1)" = "tripcoil $V"'
