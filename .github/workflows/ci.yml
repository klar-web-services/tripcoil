name: ci
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: out=$(gofmt -l .) && test -z "$out"
      - run: go vet ./... && go vet -tags integration ./internal/integration/ && go vet -tags live ./internal/integration/
      - run: go test ./...
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Audit fixtures and distribution containers, with the real Grype
        run: |
          go test -tags integration -count=1 -v -timeout 40m ./internal/integration/ | tee docker.out
          ! grep -q -e '--- SKIP' docker.out
      - name: Live inventory and audit of the runner, as root
        run: |
          go test -c -tags live -o live.test ./internal/integration/
          sudo ./live.test -test.v -test.run '^TestLiveHost$' | tee live.out
          ! grep -q -e '--- SKIP' -e 'no tests to run' live.out
