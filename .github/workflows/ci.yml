name: ci
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Distribution containers
        run: go test -tags integration -count=1 -v -timeout 30m ./internal/integration/
      - name: Live inventory of the runner, as root
        run: |
          go test -c -tags live -o live.test ./internal/integration/
          sudo ./live.test -test.v -test.run TestLiveHost
